name: Validate dotfiles
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # main, 2026-09-14
      - name: Install validation tools
        run: brew install chezmoi zsh shellcheck shfmt gitleaks
      - name: Validate isolated configuration and scripts
        run: scripts/test
